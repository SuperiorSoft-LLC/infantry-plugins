[package]
name = "infantry-sites"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Infantry AI Hosting: a native sidecar plugin that is a client of the WebServices API (no secrets live here)"
publish = false

[[bin]]
name = "infantry-sites"
path = "src/main.rs"

[dependencies]
# SVC-8: a git dependency, so the build needs no checkout on this machine. The release workflow and `stage.sh` build it
# as is; a developer who edits the SDK points it at a local checkout in a machine-local `.cargo/config.toml`
# (`[patch."https://github.com/SuperiorSoft-LLC/infantry-ai.git"] infantry-plugin-sdk = { path = "..." }`), never here.
infantry-plugin-sdk = { git = "https://github.com/SuperiorSoft-LLC/infantry-ai.git", branch = "feature-rust-port" }
rand = { version = "0.10", features = ["thread_rng"] }
russh = { version = "0.65.4", default-features = false, features = ["flate2", "ring", "rsa"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "net", "macros", "io-util"] }

# Not part of any parent workspace: this folder builds on its own.
[workspace]
