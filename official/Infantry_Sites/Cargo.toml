[package]
name = "infantry-sites"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Infantry AI Hosting: a native sidecar plugin that is a client of the WebServices API (no secrets live here)"
publish = false

[[bin]]
name = "infantry-sites"
path = "src/main.rs"

[dependencies]
# Path dependency for now; at release it becomes a git dependency on SuperiorSoft-LLC/infantry (rust/crates/infantry-plugin-sdk).
infantry-plugin-sdk = { path = "C:/Users/antho/agenthq-standalone/.worktrees/ticket-99604d99-svc-fix-4-hosting-plugin-handles-calls-o/rust/crates/infantry-plugin-sdk" }
rand = { version = "0.10", features = ["thread_rng"] }
russh = { version = "0.65.4", default-features = false, features = ["flate2", "ring", "rsa"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "net", "macros", "io-util"] }

# Not part of any parent workspace: this folder builds on its own.
[workspace]
